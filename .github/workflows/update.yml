# Twice a day: this season's results from football-data.co.uk and matchday, the ratings and predictions rebuilt,
# and data/ committed back if anything moved. GitHub Pages serves the branch as it is.
name: update
on:
  schedule:
    - cron: '15 6 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/fetch.mjs --current
      - run: node scripts/import.mjs --current
      - run: node scripts/build.mjs
      - name: commit
        run: |
          git config user.name "premelo"
          git config user.email "premelo@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Ratings through $(date -u +%F)"; git push; }
